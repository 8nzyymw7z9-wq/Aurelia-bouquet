<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Aurelia Bouquet</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #e8f5ef;
      text-align: center;
      color: #456052;
    }

    header {
      background: #cfe8e0;
      padding: 40px 20px;
    }

    h1 {
      font-size: 40px;
      letter-spacing: 5px;
      margin: 0;
    }

    .box {
      background: white;
      margin: 30px 15px;
      padding: 25px;
      border-radius: 20px;
    }

    h2 {
      color: #668f7a;
    }
  </style>

<body>

  <header>
    <h1>AURELIA</h1>
    <p>ออกแบบช่อดอกไม้ของคุณ</p>
  </header>

  <div class="box">
    <h2>🌸 เว็บไซต์กำลังอัปเดต</h2>
    <p>ถ้าคุณเห็นข้อความนี้ แปลว่าโค้ดใหม่ทำงานแล้ว</p>
    <p><strong>ทดสอบระบบวันที่ 3 กันยายน 2026</strong></p>
  </div>

</body>
</html>
