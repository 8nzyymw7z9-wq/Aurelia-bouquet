<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AURELIA | Design Your Bouquet</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f7fbfa;
  color:#40594e;
}

header{
  background:linear-gradient(135deg,#d8edf5,#dcefe2);
  text-align:center;
  padding:32px 20px;
}

header h1{
  margin:0;
  font-family:Georgia,serif;
  font-size:42px;
  letter-spacing:8px;
}

header p{
  margin:10px 0 0;
  font-size:12px;
  letter-spacing:2px;
  color:#668075;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:25px 15px 70px;
}

/* ================= BOUQUET ================= */

.preview-section{
  background:white;
  border-radius:25px;
  padding:25px;
  margin-bottom:35px;
  box-shadow:0 5px 20px rgba(70,100,85,.08);
  border:1px solid #dce9e3;
}

.preview-section h2{
  text-align:center;
  margin-top:0;
}

.bouquet-preview{
  position:relative;
  width:100%;
  height:520px;
  overflow:hidden;
  border-radius:20px;
  border:2px dashed #bdd4c7;
  background:
    radial-gradient(circle at center,#fff 0%,#f7fbf9 65%,#edf6f1 100%);
}

.empty-message{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:100%;
  text-align:center;
  color:#91a59b;
}

/* ================= WRAPPING ================= */

.bouquet-wrapper{
  position:absolute;
  width:360px;
  height:300px;
  left:50%;
  bottom:-15px;
  transform:translateX(-50%);
  z-index:1;
  pointer-events:none;
}

.wrapper-back{
  position:absolute;
  width:100%;
  height:100%;
}

/* ทรงมาตรฐาน */

.shape-classic{
  clip-path:polygon(50% 0%,100% 38%,78% 100%,22% 100%,0% 38%);
}

/* ทรงสามเหลี่ยม */

.shape-triangle{
  clip-path:polygon(50% 0%,100% 100%,0% 100%);
}

/* ทรงพัด */

.shape-fan{
  clip-path:polygon(50% 0%,65% 10%,82% 28%,100% 100%,0% 100%,18% 28%,35% 10%);
}

/* ทรงเกาหลี */

.shape-korean{
  clip-path:polygon(
    50% 0%,
    68% 8%,
    100% 30%,
    82% 55%,
    95% 100%,
    5% 100%,
    18% 55%,
    0% 30%,
    32% 8%
  );
}

/* ทรงกลม */

.shape-round{
  border-radius:50% 50% 20% 20%;
}

/* ================= RIBBON ================= */

.ribbon{
  position:absolute;
  width:150px;
  height:70px;
  left:50%;
  bottom:30px;
  transform:translateX(-50%);
  z-index:500;
  pointer-events:none;
}

.ribbon-center{
  position:absolute;
  width:28px;
  height:28px;
  border-radius:50%;
  left:61px;
  top:15px;
  z-index:3;
}

.ribbon-left,
.ribbon-right{
  position:absolute;
  width:65px;
  height:45px;
  top:5px;
}

.ribbon-left{
  left:0;
  border-radius:70% 20% 70% 20%;
  transform:rotate(20deg);
}

.ribbon-right{
  right:0;
  border-radius:20% 70% 20% 70%;
  transform:rotate(-20deg);
}

.ribbon-tail-left,
.ribbon-tail-right{
  position:absolute;
  width:20px;
  height:65px;
  top:35px;
}

.ribbon-tail-left{
  left:48px;
  transform:rotate(15deg);
}

.ribbon-tail-right{
  right:48px;
  transform:rotate(-15deg);
}

/* ================= FLOWERS ================= */

.preview-flower{
  position:absolute;
  width:130px;
  height:180px;
  object-fit:contain;
  cursor:grab;
  user-select:none;
  -webkit-user-drag:none;
  touch-action:none;
  transform-origin:center center;
}

.preview-flower:active{
  cursor:grabbing;
}

.preview-flower.selected-flower{
  filter:drop-shadow(0 6px 10px rgba(50,80,65,.30));
  outline:2px dashed #7fae96;
  outline-offset:4px;
}

/* ================= EDIT TOOLS ================= */

.edit-tools{
  display:none;
  justify-content:center;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin-top:15px;
  padding:15px;
  background:#f5faf7;
  border-radius:18px;
  border:1px solid #dce9e3;
}

.edit-tools.show{
  display:flex;
}

.edit-tools-title{
  width:100%;
  text-align:center;
  font-size:13px;
  color:#71867b;
  margin-bottom:5px;
}

.edit-btn{
  border:1px solid #d5e5dc;
  background:white;
  color:#527565;
  padding:10px 13px;
  border-radius:12px;
  cursor:pointer;
  font-size:14px;
}

.edit-btn:hover{
  background:#dcefe5;
}

/* ================= BUTTONS ================= */

.preview-buttons{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin-top:15px;
}

.preview-buttons button{
  border:none;
  background:#dcefe5;
  color:#527565;
  padding:11px 18px;
  border-radius:20px;
  cursor:pointer;
}

.preview-buttons button:hover{
  background:#bfdccd;
}

/* ================= PRICE ================= */

.total-box{
  text-align:center;
  margin-top:20px;
}

.total-label{
  font-size:14px;
  color:#80958a;
}

.total-price{
  margin-top:5px;
  font-size:28px;
  font-weight:bold;
  color:#5f8b75;
}

/* ================= SECTION ================= */

.section-title{
  text-align:center;
  margin:45px 0 5px;
}

.section-subtitle{
  text-align:center;
  color:#80958a;
  margin-bottom:20px;
}

/* ================= FLOWER GRID ================= */

.flower-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(270px,1fr));
  gap:20px;
}

.flower-card{
  background:white;
  border-radius:20px;
  overflow:hidden;
  border:1px solid #dce9e3;
  box-shadow:0 5px 15px rgba(60,90,75,.08);
}

.flower-info{
  padding:18px;
}

.flower-name{
  font-size:19px;
  font-weight:bold;
  margin-bottom:5px;
}

.price{
  color:#6f9882;
  font-weight:bold;
  margin-bottom:12px;
}

.variant-row{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 0;
  border-top:1px solid #edf2ef;
}

.variant-image{
  width:65px;
  height:65px;
  object-fit:contain;
}

.variant-name{
  flex:1;
}

.quantity-box{
  display:flex;
  align-items:center;
  gap:8px;
}

.qty-btn{
  width:34px;
  height:34px;
  border:none;
  border-radius:50%;
  background:#dcefe5;
  color:#527565;
  font-size:20px;
  cursor:pointer;
}

.quantity{
  min-width:20px;
  text-align:center;
  font-weight:bold;
}

/* ================= WRAP OPTIONS ================= */

.option-section{
  background:white;
  padding:25px;
  border-radius:22px;
  border:1px solid #dce9e3;
  margin-top:30px;
}

.option-group{
  margin-bottom:25px;
}

.option-group:last-child{
  margin-bottom:0;
}

.option-group h3{
  margin-top:0;
}

.option-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.option-btn{
  border:1px solid #d5e5dc;
  background:#fff;
  color:#527565;
  padding:10px 15px;
  border-radius:15px;
  cursor:pointer;
}

.option-btn.active{
  background:#cfe5d9;
  border-color:#8fb8a1;
}

/* สี */

.color-options{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
}

.color-dot{
  width:38px;
  height:38px;
  border-radius:50%;
  border:3px solid white;
  box-shadow:0 0 0 1px #c8d8d0;
  cursor:pointer;
}

.color-dot.active{
  box-shadow:0 0 0 3px #527565;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

  header h1{
    font-size:30px;
  }

  .bouquet-preview{
    height:440px;
  }

  .preview-flower{
    width:105px;
    height:150px;
  }

  .bouquet-wrapper{
    width:300px;
    height:250px;
  }

  .flower-grid{
    grid-template-columns:1fr;
  }

}

</style>
</head>

<body>

<header>
  <h1>AURELIA</h1>
  <p>DESIGN YOUR OWN BOUQUET</p>
</header>

<div class="container">

<div class="preview-section">

<h2>💐 ช่อดอกไม้ของคุณ</h2>

<div class="bouquet-preview" id="bouquetPreview">

<div class="empty-message" id="emptyMessage">
เลือกดอกไม้ด้านล่างเพื่อเริ่มออกแบบช่อของคุณ
</div>

<div class="bouquet-wrapper" id="bouquetWrapper">
  <div class="wrapper-back shape-classic" id="wrapperShape"></div>
</div>

<div class="ribbon" id="ribbon">

  <div class="ribbon-left"></div>
  <div class="ribbon-right"></div>
  <div class="ribbon-center"></div>
  <div class="ribbon-tail-left"></div>
  <div class="ribbon-tail-right"></div>

</div>

</div>

<!-- เครื่องมือแก้ดอกไม้ -->

<div class="edit-tools" id="editTools">

<div class="edit-tools-title">
เลือกดอกไม้ในช่อเพื่อปรับแต่ง
</div>

<button class="edit-btn" onclick="rotateSelected(-15)">
↶ หมุนซ้าย
</button>

<button class="edit-btn" onclick="resizeSelected(-0.1)">
− เล็กลง
</button>

<button class="edit-btn" onclick="resizeSelected(0.1)">
＋ ใหญ่ขึ้น
</button>

<button class="edit-btn" onclick="rotateSelected(15)">
หมุนขวา ↷
</button>

<button class="edit-btn" onclick="bringForward()">
⬆️ ขึ้นด้านหน้า
</button>

<button class="edit-btn" onclick="sendBackward()">
⬇️ ลงด้านหลัง
</button>

<button class="edit-btn" onclick="deleteSelectedFlower()">
🗑 ลบดอก
</button>

</div>

<div class="preview-buttons">

<button onclick="autoArrange()">
✨ จัดช่ออัตโนมัติ
</button>

<button onclick="resetBouquet()">
↺ เริ่มใหม่
</button>

</div>

<div class="total-box">

<div class="total-label">
ราคารวมเบื้องต้น
</div>

<div class="total-price" id="totalPrice">
0 บาท
</div>

</div>

</div>


<!-- ================= ดอกไม้ ================= -->

<h2 class="section-title">
เลือกดอกไม้
</h2>

<p class="section-subtitle">
เลือกสีและจำนวนดอกไม้ที่ต้องการ
</p>

<div class="flower-grid" id="flowerGrid"></div>


<!-- ================= กระดาษและริบบิ้น ================= -->

<div class="option-section">

<div class="option-group">

<h3>📄 เลือกทรงกระดาษห่อ</h3>

<div class="option-buttons">

<button class="option-btn active"
onclick="setWrapperShape('shape-classic',this)">
ทรงมาตรฐาน
</button>

<button class="option-btn"
onclick="setWrapperShape('shape-triangle',this)">
ทรงสามเหลี่ยม
</button>

<button class="option-btn"
onclick="setWrapperShape('shape-fan',this)">
ทรงพัด
</button>

<button class="option-btn"
onclick="setWrapperShape('shape-korean',this)">
ทรงเกาหลี
</button>

<button class="option-btn"
onclick="setWrapperShape('shape-round',this)">
ทรงกลม
</button>

</div>

</div>


<div class="option-group">

<h3>🎨 เลือกสีกระดาษห่อ</h3>

<div class="color-options" id="wrapperColors"></div>

</div>


<div class="option-group">

<h3>🎀 เลือกสีริบบิ้น</h3>

<div class="color-options" id="ribbonColors"></div>

</div>

</div>


</div>


<script>

/* =====================================
   ข้อมูลดอกไม้
===================================== */

const flowers = [

{
name:"ดอกกุหลาบใหญ่",
price:50,

variants:[
{color:"แดง",image:"IMG_0139.png"},
{color:"ชมพู",image:"IMG_0140.png"},
{color:"ขาว",image:"IMG_0141.png"}
]

},

{
name:"ดอกกุหลาบเล็ก",
price:30,

variants:[
{color:"แดง",image:"IMG_0145.png"},
{color:"โอรส",image:"IMG_0147.png"},
{color:"ชมพู",image:"IMG_0146.png"}
]

},

/* ดอกอื่น ๆ รอใส่รูปจริงทีหลัง */

{
name:"ดอกลิลลี่บาน",
price:40,
variants:[
{color:"รอเพิ่มรูป",image:""}
]
},

{
name:"ดอกลิลลี่กลีบเกลียว",
price:40,
variants:[
{color:"รอเพิ่มรูป",image:""}
]
},

{
name:"ดอกลิลลี่กลีบโค้ง",
price:35,
variants:[
{color:"รอเพิ่มรูป",image:""}
]
},

{
name:"ดอกทานตะวัน",
price:35,
variants:[
{color:"รอเพิ่มรูป",image:""}
]
},

{
name:"ดอกทานตะวันรีดกลีบ",
price:40,
variants:[
{color:"รอเพิ่มรูป",image:""}
]
},

{
name:"ดอกระฆัง 6 ดอก",
price:49,
variants:[
{color:"รอเพิ่มรูป",image:""}
]
},

{
name:"ดอกระฆัง 8 ดอก",
price:69,
variants:[
{color:"รอเพิ่มรูป",image:""}
]
},

{
name:"ดอกคาร์เนชั่น",
price:30,
variants:[
{color:"รอเพิ่มรูป",image:""}
]
},

{
name:"ดอกลิลลี่แห่งหุบเขา 7 ดอก",
price:49,
variants:[
{color:"รอเพิ่มรูป",image:""}
]
},

{
name:"ดอกทิวลิป",
price:30,
variants:[
{color:"รอเพิ่มรูป",image:""}
]
},

{
name:"ดอกเดซี่",
price:5,
variants:[
{color:"รอเพิ่มรูป",image:""}
]
},

{
name:"ดอกเยอบีร่า",
price:25,
variants:[
{color:"รอเพิ่มรูป",image:""}
]
},

{
name:"ดอกไฮเดรนเยียเล็ก",
price:45,
variants:[
{color:"รอเพิ่มรูป",image:""}
]
},

{
name:"ดอกลาเวนเดอร์เล็ก",
price:5,
variants:[
{color:"รอเพิ่มรูป",image:""}
]
},

{
name:"ดอกกล้วยไม้",
price:20,
variants:[
{color:"รอเพิ่มรูป",image:""}
]
},

{
name:"ดอกคาลล่าลิลลี่",
price:20,
variants:[
{color:"รอเพิ่มรูป",image:""}
]
},

{
name:"ดอกป๊อบปี้",
price:30,
variants:[
{color:"รอเพิ่มรูป",image:""}
]
},

{
name:"ดอกไฮยาซินธ์",
price:20,
variants:[
{color:"รอเพิ่มรูป",image:""}
]
}

];


/* =====================================
   ตัวแปร
===================================== */

const flowerGrid=document.getElementById("flowerGrid");
const bouquetPreview=document.getElementById("bouquetPreview");
const editTools=document.getElementById("editTools");
const emptyMessage=document.getElementById("emptyMessage");

let activeFlower=null;

const selectedFlowers={};

flowers.forEach((flower,index)=>{

selectedFlowers[index]={};

flower.variants.forEach((variant,vIndex)=>{
selectedFlowers[index][vIndex]=0;
});

});


/* =====================================
   สร้างการ์ดดอกไม้
===================================== */

function renderFlowerCards(){

flowerGrid.innerHTML="";

flowers.forEach((flower,index)=>{

let variantsHTML="";

flower.variants.forEach((variant,vIndex)=>{

const imageHTML=variant.image
? `<img class="variant-image" src="${variant.image}">`
: `<div class="variant-image" style="background:#f3f5f4;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#91a59b;">รอรูป</div>`;

variantsHTML+=`

<div class="variant-row">

${imageHTML}

<div class="variant-name">
${variant.color}
</div>

<div class="quantity-box">

<button class="qty-btn"
onclick="changeQuantity(${index},${vIndex},-1)">
−
</button>

<div class="quantity"
id="qty-${index}-${vIndex}">
0
</div>

<button class="qty-btn"
onclick="changeQuantity(${index},${vIndex},1)">
+
</button>

</div>

</div>

`;

});

flowerGrid.innerHTML+=`

<div class="flower-card">

<div class="flower-info">

<div class="flower-name">
${flower.name}
</div>

<div class="price">
${flower.price} บาท
</div>

${variantsHTML}

</div>

</div>

`;

});

}

renderFlowerCards();


/* =====================================
   เพิ่มลดจำนวน
===================================== */

function changeQuantity(index,vIndex,change){

let current=selectedFlowers[index][vIndex];

current+=change;

if(current<0){
current=0;
}

selectedFlowers[index][vIndex]=current;

document.getElementById(
`qty-${index}-${vIndex}`
).innerText=current;

updateBouquet();

}


/* =====================================
   อัปเดตช่อ
===================================== */

function updateBouquet(){

document.querySelectorAll(".preview-flower").forEach(
flower=>flower.remove()
);

activeFlower=null;
editTools.classList.remove("show");

let total=0;
let flowerNumber=0;
let hasFlowers=false;

flowers.forEach((flower,index)=>{

flower.variants.forEach((variant,vIndex)=>{

const quantity=selectedFlowers[index][vIndex];

if(quantity>0){

hasFlowers=true;

total+=quantity*flower.price;

for(let i=0;i<quantity;i++){

if(variant.image){

createBouquetFlower(
variant.image,
flower.name,
variant.color,
flowerNumber
);

flowerNumber++;

}

}

}

});

});

emptyMessage.style.display=
hasFlowers ? "none" : "block";

document.getElementById("totalPrice").innerText=
total.toLocaleString()+" บาท";

}


/* =====================================
   สร้างดอก
===================================== */

function createBouquetFlower(image,name,color,number){

const img=document.createElement("img");

img.src=image;

img.className="preview-flower";

img.alt=name+" "+color;

img.dataset.rotation=0;
img.dataset.scale=1;
img.dataset.layer=10+number;

const column=number%4;
const row=Math.floor(number/4);

img.style.left=(25+column*15)+"%";
img.style.top=(12+row*12)+"%";
img.style.zIndex=10+number;

makeDraggable(img);

bouquetPreview.appendChild(img);

}


/* =====================================
   ลากดอกไม้
===================================== */

function makeDraggable(element){

let startX,startY;
let originalLeft,originalTop;
let moved=false;

element.addEventListener("pointerdown",function(e){

element.setPointerCapture(e.pointerId);

startX=e.clientX;
startY=e.clientY;

originalLeft=parseFloat(element.style.left)||0;
originalTop=parseFloat(element.style.top)||0;

moved=false;

function drag(e){

const rect=bouquetPreview.getBoundingClientRect();

const diffX=e.clientX-startX;
const diffY=e.clientY-startY;

if(Math.abs(diffX)>5||Math.abs(diffY)>5){
moved=true;
}

element.style.left=
originalLeft+(diffX/rect.width)*100+"%";

element.style.top=
originalTop+(diffY/rect.height)*100+"%";

}

function stop(e){

element.removeEventListener("pointermove",drag);
element.removeEventListener("pointerup",stop);
element.removeEventListener("pointercancel",stop);

if(!moved){
selectFlower(element);
}

}

element.addEventListener("pointermove",drag);
element.addEventListener("pointerup",stop);
element.addEventListener("pointercancel",stop);

});

}


/* =====================================
   เลือกดอก
===================================== */

function selectFlower(element){

document.querySelectorAll(".preview-flower").forEach(flower=>{
flower.classList.remove("selected-flower");
});

element.classList.add("selected-flower");

activeFlower=element;

editTools.classList.add("show");

}


/* =====================================
   Transform
===================================== */

function updateFlowerTransform(flower){

const rotation=parseFloat(flower.dataset.rotation)||0;
const scale=parseFloat(flower.dataset.scale)||1;

flower.style.transform=
`rotate(${rotation}deg) scale(${scale})`;

}


/* =====================================
   หมุน
===================================== */

function rotateSelected(degree){

if(!activeFlower)return;

let rotation=
parseFloat(activeFlower.dataset.rotation)||0;

rotation+=degree;

activeFlower.dataset.rotation=rotation;

updateFlowerTransform(activeFlower);

}


/* =====================================
   ย่อขยาย
===================================== */

function resizeSelected(amount){

if(!activeFlower)return;

let scale=
parseFloat(activeFlower.dataset.scale)||1;

scale+=amount;

if(scale<0.3)scale=0.3;
if(scale>3)scale=3;

activeFlower.dataset.scale=scale;

updateFlowerTransform(activeFlower);

}


/* =====================================
   LAYER ขึ้นหน้า
===================================== */

function bringForward(){

if(!activeFlower)return;

let currentZ=
parseInt(activeFlower.style.zIndex)||10;

const flowersInBouquet=[
...document.querySelectorAll(".preview-flower")
];

let nextFlower=null;
let nextZ=Infinity;

flowersInBouquet.forEach(flower=>{

const z=parseInt(flower.style.zIndex)||10;

if(z>currentZ&&z<nextZ){
nextZ=z;
nextFlower=flower;
}

});

if(nextFlower){

nextFlower.style.zIndex=currentZ;
activeFlower.style.zIndex=nextZ;

}else{

activeFlower.style.zIndex=currentZ+1;

}

}


/* =====================================
   LAYER ลงหลัง
===================================== */

function sendBackward(){

if(!activeFlower)return;

let currentZ=
parseInt(activeFlower.style.zIndex)||10;

const flowersInBouquet=[
...document.querySelectorAll(".preview-flower")
];

let previousFlower=null;
let previousZ=-Infinity;

flowersInBouquet.forEach(flower=>{

const z=parseInt(flower.style.zIndex)||10;

if(z<currentZ&&z>previousZ){
previousZ=z;
previousFlower=flower;
}

});

if(previousFlower){

previousFlower.style.zIndex=currentZ;
activeFlower.style.zIndex=previousZ;

}else{

activeFlower.style.zIndex=2;

}

}


/* =====================================
   ลบดอก
===================================== */

function deleteSelectedFlower(){

if(!activeFlower)return;

activeFlower.remove();

activeFlower=null;

editTools.classList.remove("show");

const remaining=
document.querySelectorAll(".preview-flower");

if(remaining.length===0){
emptyMessage.style.display="block";
}

}


/* =====================================
   จัดช่ออัตโนมัติ
===================================== */

function autoArrange(){

const items=[
...document.querySelectorAll(".preview-flower")
];

const total=items.length;

if(total===0)return;

items.forEach((item,index)=>{

const angle=
total>1
? ((index/(total-1))*100)-50
:0;

const radius=Math.min(28,10+total);

const x=
50+Math.sin(angle*Math.PI/180)*radius;

const y=
30+Math.abs(
Math.cos(angle*Math.PI/180)
)*12;

item.style.left=x+"%";
item.style.top=y+"%";

item.dataset.rotation=angle/5;
item.dataset.scale=1;

item.style.zIndex=10+index;

updateFlowerTransform(item);

});

}


/* =====================================
   RESET
===================================== */

function resetBouquet(){

flowers.forEach((flower,index)=>{

flower.variants.forEach((variant,vIndex)=>{

selectedFlowers[index][vIndex]=0;

document.getElementById(
`qty-${index}-${vIndex}`
).innerText=0;

});

});

document.querySelectorAll(".preview-flower").forEach(
flower=>flower.remove()
);

activeFlower=null;

editTools.classList.remove("show");

emptyMessage.style.display="block";

document.getElementById("totalPrice").innerText=
"0 บาท";

}


/* =====================================
   กระดาษห่อ
===================================== */

function setWrapperShape(shape,button){

const wrapperShape=
document.getElementById("wrapperShape");

wrapperShape.className=
"wrapper-back "+shape;

document.querySelectorAll(
".option-group:first-child .option-btn"
).forEach(btn=>btn.classList.remove("active"));

button.classList.add("active");

}


/* =====================================
   สี
===================================== */

const wrapperColorList=[

"#ffffff",
"#f3ead7",
"#f5c9d3",
"#d8e8f5",
"#cfe6d8",
"#e2d7ed",
"#f1d4b8",
"#c8a88a",
"#2f3a36"

];

const ribbonColorList=[

"#ffffff",
"#f3dfca",
"#f5a6b8",
"#9fc9e8",
"#9fc6a9",
"#c6a7dc",
"#e05d5d",
"#d8a24a",
"#3b3b3b"

];


function renderColors(){

const wrapperContainer=
document.getElementById("wrapperColors");

const ribbonContainer=
document.getElementById("ribbonColors");


wrapperColorList.forEach((color,index)=>{

const dot=document.createElement("div");

dot.className=
"color-dot"+(index===0?" active":"");

dot.style.background=color;

dot.onclick=function(){

document.getElementById("wrapperShape")
.style.background=color;

wrapperContainer
.querySelectorAll(".color-dot")
.forEach(d=>d.classList.remove("active"));

dot.classList.add("active");

};

wrapperContainer.appendChild(dot);

});


ribbonColorList.forEach((color,index)=>{

const dot=document.createElement("div");

dot.className=
"color-dot"+(index===0?" active":"");

dot.style.background=color;

dot.onclick=function(){

document.querySelectorAll(
".ribbon-left,.ribbon-right,.ribbon-center,.ribbon-tail-left,.ribbon-tail-right"
).forEach(part=>{

part.style.background=color;

});

ribbonContainer
.querySelectorAll(".color-dot")
.forEach(d=>d.classList.remove("active"));

dot.classList.add("active");

};

ribbonContainer.appendChild(dot);

});

}


/* เริ่มต้น */

document.getElementById("wrapperShape")
.style.background="#ffffff";

document.querySelectorAll(
".ribbon-left,.ribbon-right,.ribbon-center,.ribbon-tail-left,.ribbon-tail-right"
).forEach(part=>{

part.style.background="#ffffff";

});

renderColors();

</script>
