<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AURELIA | Design Your Bouquet</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f7fbfa;
  color:#40594e;
}

header{
  background:linear-gradient(135deg,#d8edf5,#dcefe2);
  text-align:center;
  padding:35px 20px;
}

header h1{
  margin:0;
  font-family:Georgia,serif;
  font-size:42px;
  letter-spacing:8px;
}

header p{
  margin:10px 0 0;
  color:#668075;
  letter-spacing:1px;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:25px 15px 70px;
}

/* ================= PREVIEW ================= */

.preview-section{
  background:white;
  border-radius:25px;
  padding:25px;
  margin-bottom:35px;
  box-shadow:0 5px 20px rgba(70,100,85,.08);
  border:1px solid #dce9e3;
}

.preview-section h2{
  text-align:center;
  margin-top:0;
}

/* พื้นที่จัดช่อ */

.bouquet-preview{
  position:relative;
  height:400px;
  background:linear-gradient(to bottom,#f9fdfb,#edf6f1);
  border-radius:20px;
  overflow:hidden;
  border:1px dashed #bdd4c7;
}

/* ข้อความตอนยังไม่มีดอก */

.empty-message{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  color:#91a59b;
  text-align:center;
}

/* ดอกไม้ในช่อ */

.preview-flower{
  position:absolute;
  width:130px;
  height:180px;
  object-fit:contain;
  cursor:grab;
  user-select:none;
  -webkit-user-drag:none;
  touch-action:none;
  transition:filter .2s;
}

.preview-flower:active{
  cursor:grabbing;
  filter:drop-shadow(0 8px 8px rgba(0,0,0,.15));
}

/* ปุ่ม */

.preview-buttons{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:15px;
  flex-wrap:wrap;
}

.preview-buttons button{
  border:none;
  background:#dcefe5;
  color:#527565;
  padding:10px 16px;
  border-radius:20px;
  cursor:pointer;
  font-size:14px;
}

.preview-buttons button:hover{
  background:#bfdccd;
}

.total-box{
  text-align:center;
  margin-top:20px;
}

.total-price{
  font-size:24px;
  font-weight:bold;
  color:#5f8b75;
}

/* ================= FLOWERS ================= */

.section-title{
  text-align:center;
  margin:35px 0 5px;
}

.section-subtitle{
  text-align:center;
  color:#80958a;
  margin-bottom:25px;
}

.flower-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:18px;
}

.flower-card{
  background:white;
  border-radius:20px;
  overflow:hidden;
  border:1px solid #dce9e3;
  box-shadow:0 5px 15px rgba(60,90,75,.08);
}

.flower-image{
  width:100%;
  height:220px;
  object-fit:contain;
  padding:15px;
  background:#f8fbf9;
  display:block;
}

.flower-info{
  padding:15px;
}

.flower-name{
  font-size:17px;
  font-weight:bold;
  margin-bottom:5px;
}

.price{
  color:#6f9882;
  font-weight:bold;
  margin-bottom:15px;
}

/* เลือกสีจากรูป */

.variant-options{
  display:flex;
  gap:10px;
  margin-bottom:12px;
}

.variant-btn{
  width:55px;
  height:55px;
  border-radius:12px;
  border:2px solid transparent;
  background:#f5f8f6;
  padding:3px;
  cursor:pointer;
}

.variant-btn img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.variant-btn.selected{
  border-color:#76a58e;
}

/* จำนวน */

.quantity-box{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:15px;
  margin-top:12px;
}

.qty-btn{
  width:38px;
  height:38px;
  border:none;
  border-radius:50%;
  background:#dcefe5;
  color:#527565;
  font-size:22px;
  cursor:pointer;
}

.quantity{
  font-size:18px;
  font-weight:bold;
  min-width:25px;
  text-align:center;
}

/* หมายเหตุ */

.note{
  margin-top:40px;
  background:#e4f1eb;
  padding:18px;
  border-radius:15px;
  text-align:center;
  color:#668075;
}

/* มือถือ */

@media(max-width:600px){

  header h1{
    font-size:32px;
  }

  .flower-grid{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .flower-image{
    height:150px;
  }

  .flower-info{
    padding:10px;
  }

  .flower-name{
    font-size:14px;
  }

  .bouquet-preview{
    height:350px;
  }

  .preview-flower{
    width:110px;
    height:150px;
  }

}

</style>
</head>

<body>

<header>
  <h1>AURELIA</h1>
  <p>DESIGN YOUR OWN BOUQUET</p>
</header>

<div class="container">

<!-- ================= ช่อดอกไม้ ================= -->

<div class="preview-section">

<h2>💐 ช่อดอกไม้ของคุณ</h2>

<div class="bouquet-preview" id="bouquetPreview">

<div class="empty-message">
เริ่มเลือกดอกไม้เพื่อสร้างช่อของคุณ
</div>

</div>

<div class="preview-buttons">

<button onclick="autoArrange()">
✨ จัดช่ออัตโนมัติ
</button>

<button onclick="resetBouquet()">
↺ เริ่มใหม่
</button>

</div>

<div class="total-box">

ราคารวมเบื้องต้น

<div class="total-price" id="totalPrice">
0 บาท
</div>

</div>

</div>


<!-- ================= เลือกดอกไม้ ================= -->

<h2 class="section-title">เลือกดอกไม้</h2>

<p class="section-subtitle">
เลือกสีและจำนวนดอกไม้ที่ต้องการ
</p>

<div class="flower-grid" id="flowerGrid"></div>


<div class="note">
คุณสามารถเลือกดอกไม้ แล้วลากจัดตำแหน่งในช่อได้ด้วยตัวเอง
</div>

</div>


<script>

/* ================= ข้อมูลดอกไม้ ================= */

const flowers = [

{

price:50,

variants:[
{
color:"แดง",
image:"IMG_0139.png"
},
{
color:"ชมพู",
image:"IMG_0140.png"
},
{
color:"ขาว",
image:"IMG_0141.png"
}
]

},

{
name:"ดอกกุหลาบเล็ก",
price:30,
image:"https://images.unsplash.com/photo-1518709594023-6eab9bab7b23?auto=format&fit=crop&w=600&q=80"
},

{
name:"ดอกลิลลี่บาน",
price:40,
image:"https://images.unsplash.com/photo-1551799517-eb8f03cb5e6a?auto=format&fit=crop&w=600&q=80"
},

{
name:"ดอกลิลลี่หุบ",
price:20,
image:"https://images.unsplash.com/photo-1497250681960-ef046c08a56e?auto=format&fit=crop&w=600&q=80"
},

{
name:"ดอกทานตะวัน",
price:35,
image:"https://images.unsplash.com/photo-1551731409-43eb3e517a1a?auto=format&fit=crop&w=600&q=80"
},

{
name:"ดอกทานตะวันรีดกลีบ",
price:40,
image:"https://images.unsplash.com/photo-1597848212624-a19eb35e2651?auto=format&fit=crop&w=600&q=80"
},

{
name:"ดอกระฆัง 6 ดอก",
price:49,
image:"https://images.unsplash.com/photo-1469259943454-aa100abba749?auto=format&fit=crop&w=600&q=80"
},

{
name:"ดอกระฆัง 8 ดอก",
price:69,
image:"https://images.unsplash.com/photo-1468327768560-75b778cbb551?auto=format&fit=crop&w=600&q=80"
},

{
name:"ดอกคาร์เนชั่น",
price:30,
image:"https://images.unsplash.com/photo-1494976388531-d1058494cdd8?auto=format&fit=crop&w=600&q=80"
},

{
name:"ดอกลิลลี่แห่งหุบเขา 7 ดอก",
price:49,
image:"https://images.unsplash.com/photo-1487530811176-3780de880c2d?auto=format&fit=crop&w=600&q=80"
},

{
name:"ดอกทิวลิป",
price:30,
image:"https://images.unsplash.com/photo-1520763185298-1b434c919102?auto=format&fit=crop&w=600&q=80"
},

{
name:"ดอกเดซี่",
price:5,
image:"https://images.unsplash.com/photo-1497250681960-ef046c08a56e?auto=format&fit=crop&w=600&q=80"
},

{
name:"ดอกเยอบีร่า",
price:25,
image:"https://images.unsplash.com/photo-1526047932273-341f2a7631f9?auto=format&fit=crop&w=600&q=80"
},

{
name:"ดอกไฮเดรนเยียเล็ก",
price:45,
image:"https://images.unsplash.com/photo-1501004318641-b39e6451bec6?auto=format&fit=crop&w=600&q=80"
},

{
name:"ดอกลาเวนเดอร์เล็ก",
price:5,
image:"https://images.unsplash.com/photo-1499002238440-d264edd596ec?auto=format&fit=crop&w=600&q=80"
},

{
name:"ดอกกล้วยไม้",
price:20,
image:"https://images.unsplash.com/photo-1498814117408-e396f5507073?auto=format&fit=crop&w=600&q=80"
},

{
name:"ดอกคาลล่าลิลลี่",
price:20,
image:"https://images.unsplash.com/photo-1453904300235-0f2f60b15b5d?auto=format&fit=crop&w=600&q=80"
},

{
name:"ดอกป๊อบปี้",
price:30,
image:"https://images.unsplash.com/photo-1501426026826-31c667bdf23d?auto=format&fit=crop&w=600&q=80"
},

{
name:"ดอกไฮยาซินธ์",
price:20,

},

{
name:"ดอกทิวลิปเกลียว",
price:20,

},

{
name:"ดอกลิลลี่บานน้อย",
price:20,
image:"https://images.unsplash.com/photo-1551799517-eb8f03cb5e6a?auto=format&fit=crop&w=600&q=80"
},

{
name:"ดอกลิลลี่กลีบโค้ง",
price:20,
image:"https://images.unsplash.com/photo-1551731409-43eb3e517a1a?auto=format&fit=crop&w=600&q=80"
}

];


/* ================= ตัวแปร ================= */

const flowerGrid = document.getElementById("flowerGrid");
const bouquetPreview = document.getElementById("bouquetPreview");

const selectedFlowers = {};

flowers.forEach((flower,index)=>{

selectedFlowers[index]={
quantity:0,
variant:0
};

});


/* ================= สร้างการ์ด ================= */

flowers.forEach((flower,index)=>{

let mainImage =
flower.variants
? flower.variants[0].image
: flower.image;

let variantHTML="";

if(flower.variants){

flower.variants.forEach((variant,vIndex)=>{

variantHTML += `

<button
class="variant-btn ${vIndex===0 ? 'selected' : ''}"
onclick="selectVariant(${index},${vIndex},this)"
title="${variant.color}"
>

<img src="${variant.image}" alt="${variant.color}">

</button>

`;

});

}

flowerGrid.innerHTML += `

<div class="flower-card">

<img
class="flower-image"
id="main-image-${index}"
src="${mainImage}"
alt="${flower.name}"
>

<div class="flower-info">

<div class="flower-name">
${flower.name}
</div>

<div class="price">
${flower.price} บาท
</div>

${variantHTML ? `
<div class="variant-options">
${variantHTML}
</div>
` : ''}

<div class="quantity-box">

<button
class="qty-btn"
onclick="changeQuantity(${index},-1)">
−
</button>

<div
class="quantity"
id="qty-${index}">
0
</div>

<button
class="qty-btn"
onclick="changeQuantity(${index},1)">
+
</button>

</div>

</div>

</div>

`;

});


/* ================= เลือกสี ================= */

function selectVariant(index,vIndex,button){

selectedFlowers[index].variant=vIndex;

const flower=flowers[index];

document.getElementById(`main-image-${index}`).src =
flower.variants[vIndex].image;

const card=button.closest(".flower-card");

card.querySelectorAll(".variant-btn").forEach(btn=>{
btn.classList.remove("selected");
});

button.classList.add("selected");

}


/* ================= จำนวน ================= */

function changeQuantity(index,change){

const data=selectedFlowers[index];

data.quantity += change;

if(data.quantity < 0){
data.quantity=0;
}

document.getElementById(`qty-${index}`).innerText =
data.quantity;

updateBouquet();

}


/* ================= อัปเดตช่อ ================= */

function updateBouquet(){

bouquetPreview.innerHTML="";

let total=0;
let hasFlowers=false;

flowers.forEach((flower,index)=>{

const selected=selectedFlowers[index];

if(selected.quantity>0){

hasFlowers=true;

total += selected.quantity * flower.price;

let image =
flower.variants
? flower.variants[selected.variant].image
: flower.image;


for(let i=0;i<selected.quantity;i++){

const img=document.createElement("img");

img.src=image;

img.className="preview-flower";

img.alt=flower.name;

/* ตำแหน่งเริ่มต้นแบบกระจาย */

const left =
35 + Math.random()*30;

const top =
20 + Math.random()*35;

img.style.left=left+"%";
img.style.top=top+"%";

makeDraggable(img);

bouquetPreview.appendChild(img);

}

}

});


if(!hasFlowers){

bouquetPreview.innerHTML=

`<div class="empty-message">
เริ่มเลือกดอกไม้เพื่อสร้างช่อของคุณ
</div>`;

}


document.getElementById("totalPrice").innerText =
total.toLocaleString()+" บาท";

}


/* ================= ลากดอกไม้ ================= */

function makeDraggable(element){

let startX,startY;
let originalLeft,originalTop;

element.addEventListener("pointerdown",startDrag);

function startDrag(e){

element.setPointerCapture(e.pointerId);

startX=e.clientX;
startY=e.clientY;

originalLeft=parseFloat(element.style.left);
originalTop=parseFloat(element.style.top);

element.style.zIndex=1000;

element.addEventListener("pointermove",drag);
element.addEventListener("pointerup",stopDrag);

}

function drag(e){

const rect=bouquetPreview.getBoundingClientRect();

const moveX=
((e.clientX-startX)/rect.width)*100;

const moveY=
((e.clientY-startY)/rect.height)*100;

element.style.left=
originalLeft+moveX+"%";

element.style.top=
originalTop+moveY+"%";

}

function stopDrag(e){

element.releasePointerCapture(e.pointerId);

element.removeEventListener("pointermove",drag);

element.style.zIndex="";

}

}


/* ================= จัดช่ออัตโนมัติ ================= */

function autoArrange(){

const items =
bouquetPreview.querySelectorAll(".preview-flower");

const total=items.length;

items.forEach((item,index)=>{

const angle =
(total>1)
? ((index/(total-1))*140)-70
:0;

const radius =
Math.min(25,8+total*2);

const x=
50+Math.sin(angle*Math.PI/180)*radius;

const y=
38+Math.cos(angle*Math.PI/180)*10;

item.style.left=x+"%";
item.style.top=y+"%";

item.style.transform=
`translate(-50%,-50%) rotate(${angle/5}deg)`;

});

}


/* ================= รีเซ็ต ================= */

function resetBouquet(){

flowers.forEach((flower,index)=>{

selectedFlowers[index].quantity=0;

document.getElementById(`qty-${index}`).innerText=0;

});

updateBouquet();

}

</script>

</body>
</html>
