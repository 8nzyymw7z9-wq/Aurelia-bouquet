<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AURELIA | Design Your Bouquet</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f7fbfa;
  color:#40594e;
}

header{
  background:linear-gradient(135deg,#d8edf5,#dcefe2);
  text-align:center;
  padding:35px 20px;
}

header h1{
  margin:0;
  font-family:Georgia,serif;
  font-size:42px;
  letter-spacing:8px;
}

header p{
  margin-top:10px;
  color:#668075;
  letter-spacing:1px;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:25px 15px 70px;
}

/* PREVIEW */

.preview-section{
  background:white;
  border-radius:25px;
  padding:25px;
  margin-bottom:35px;
  box-shadow:0 5px 20px rgba(70,100,85,.08);
  border:1px solid #dce9e3;
}

.preview-section h2{
  text-align:center;
  margin-top:0;
}

.bouquet-preview{
  min-height:300px;
  background:linear-gradient(to bottom,#f7fcfa,#e8f3ee);
  border-radius:20px;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
  padding:30px;
  gap:5px;
  overflow:hidden;
}

.empty-message{
  color:#91a59b;
  text-align:center;
}

.preview-flower{
  width:85px;
  height:120px;
  object-fit:cover;
  border-radius:50px 50px 15px 15px;
  margin:-8px;
  border:3px solid white;
  box-shadow:0 3px 8px rgba(0,0,0,.08);
}

.total-box{
  text-align:center;
  margin-top:20px;
}

.total-price{
  font-size:24px;
  font-weight:bold;
  color:#5f8b75;
}

/* FLOWERS */

.section-title{
  text-align:center;
  margin:35px 0 5px;
}

.section-subtitle{
  text-align:center;
  color:#80958a;
  margin-bottom:25px;
}

.flower-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:18px;
}

.flower-card{
  background:white;
  border-radius:20px;
  overflow:hidden;
  border:1px solid #dce9e3;
  box-shadow:0 5px 15px rgba(60,90,75,.08);
}

.flower-card img{
  width:100%;
  height:180px;
  object-fit:cover;
  display:block;
}

.flower-info{
  padding:15px;
}

.flower-name{
  font-size:17px;
  font-weight:bold;
  margin-bottom:5px;
}

.price{
  color:#6f9882;
  font-weight:bold;
  margin-bottom:12px;
}

.color-label{
  font-size:13px;
  margin-bottom:8px;
}

.colors{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:10px;
}

.color-btn{
  width:28px;
  height:28px;
  border-radius:50%;
  border:2px solid white;
  box-shadow:0 0 0 1px #cbd8d2;
  cursor:pointer;
}

.color-btn.selected{
  outline:3px solid #76a58e;
}

.color-input{
  width:100%;
  padding:9px;
  border:1px solid #d5e2dc;
  border-radius:10px;
  margin-bottom:12px;
}

.quantity-box{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:15px;
  margin-top:8px;
}

.qty-btn{
  width:36px;
  height:36px;
  border:none;
  border-radius:50%;
  background:#dcefe5;
  color:#527565;
  font-size:22px;
  cursor:pointer;
}

.qty-btn:hover{
  background:#bfdccd;
}

.quantity{
  font-size:18px;
  font-weight:bold;
  min-width:25px;
  text-align:center;
}

.note{
  margin-top:40px;
  background:#e4f1eb;
  padding:18px;
  border-radius:15px;
  text-align:center;
  color:#668075;
}

@media(max-width:600px){

  header h1{
    font-size:32px;
  }

  .flower-grid{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .flower-card img{
    height:130px;
  }

  .flower-info{
    padding:10px;
  }

  .flower-name{
    font-size:14px;
  }

  .preview-flower{
    width:65px;
    height:90px;
  }

}
</style>
</head>

<body>

<header>
  <h1>AURELIA</h1>
  <p>DESIGN YOUR OWN BOUQUET</p>
</header>

<div class="container">

<div class="preview-section">

<h2>💐 ช่อดอกไม้ของคุณ</h2>

<div class="bouquet-preview" id="bouquetPreview">
  <div class="empty-message">
    เริ่มเลือกดอกไม้เพื่อสร้างช่อของคุณ
  </div>
</div>

<div class="total-box">
  ราคารวมเบื้องต้น
  <div class="total-price" id="totalPrice">0 บาท</div>
</div>

</div>


<h2 class="section-title">เลือกดอกไม้</h2>

<p class="section-subtitle">
เลือกดอกไม้ สี และจำนวนที่ต้องการ
</p>


<div class="flower-grid" id="flowerGrid"></div>

<div class="note">
รูปดอกไม้ในเว็บไซต์ตอนนี้เป็นรูปตัวอย่าง
ภายหลังสามารถเปลี่ยนเป็นรูปดอกไม้จริงของ Aurelia ได้
</div>

</div>


<script>

},

},

{

},

{

},

{
name:"ดอกลิลลี่แห่งหุบเขา 7 ดอก",

},

{

},

colors:["#e63946","#ff6b6b","#ffffff"]
},

{
name:"ดอกไฮยาซินธ์",
price:20,
image:"https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=600&q=80",
colors:["#8e7cc3","#f4a7bb","#ffffff"]
},

{
name:"ดอกทิวลิปเกลียว",
price:20,
image:"https://images.unsplash.com/photo-1520763185298-1b434c919102?auto=format&fit=crop&w=600&q=80",
colors:["#e63946","#f4a7bb","#f7d154"]
},

{
name:"ดอกลิลลี่บานน้อย",
price:20,
image:"https://images.unsplash.com/photo-1551799517-eb8f03cb5e6a?auto=format&fit=crop&w=600&q=80",
colors:["#ffffff","#f4a7bb","#ffdca8"]
},

{
name:"ดอกลิลลี่กลีบโค้ง",
price:20,
image:"https://images.unsplash.com/photo-1551731409-43eb3e517a1a?auto=format&fit=crop&w=600&q=80",
colors:["#ffffff","#f4a7bb","#ffdca8"]
}

];

const selectedFlowers = {};

const flowerGrid = document.getElementById("flowerGrid");


flowers.forEach((flower,index)=>{

selectedFlowers[index] = {
quantity:0,
color:""
};

let colorHTML="";

flower.colors.forEach(color=>{

colorHTML += `
<button
class="color-btn"
style="background:${color}"
onclick="selectColor(${index}, '${color}', this)">
</button>
`;

});

flowerGrid.innerHTML += `

<div class="flower-card">

<img src="${flower.image}" alt="${flower.name}">

<div class="flower-info">

<div class="flower-name">
${flower.name}
</div>

<div class="price">
${flower.price} บาท
</div>

<div class="color-label">
เลือกสี
</div>

<div class="colors">
${colorHTML}
</div>

<input
class="color-input"
placeholder="หรือระบุสีที่ต้องการ"
oninput="typeColor(${index},this.value)"
>

<div class="quantity-box">

<button
class="qty-btn"
onclick="changeQuantity(${index},-1)">
−
</button>

<div
class="quantity"
id="qty-${index}">
0
</div>

<button
class="qty-btn"
onclick="changeQuantity(${index},1)">
+
</button>

</div>

</div>

</div>

`;

});


function selectColor(index,color,button){

selectedFlowers[index].color=color;

const card=button.closest(".flower-card");

card.querySelectorAll(".color-btn").forEach(btn=>{
btn.classList.remove("selected");
});

button.classList.add("selected");

}


function typeColor(index,value){

selectedFlowers[index].color=value;

}


function changeQuantity(index,change){

selectedFlowers[index].quantity += change;

if(selectedFlowers[index].quantity < 0){

selectedFlowers[index].quantity = 0;

}

document.getElementById(`qty-${index}`).innerText =
selectedFlowers[index].quantity;

updateBouquet();

}


function updateBouquet(){

const preview =
document.getElementById("bouquetPreview");

preview.innerHTML="";

let total=0;

let hasFlowers=false;


flowers.forEach((flower,index)=>{

const quantity =
selectedFlowers[index].quantity;

if(quantity>0){

hasFlowers=true;

total += quantity * flower.price;

for(let i=0;i<quantity;i++){

const img=document.createElement("img");

img.src=flower.image;

img.className="preview-flower";

img.alt=flower.name;

preview.appendChild(img);

}

}

});


if(!hasFlowers){

preview.innerHTML=`

<div class="empty-message">

เริ่มเลือกดอกไม้เพื่อสร้างช่อของคุณ

</div>

`;

}


document.getElementById("totalPrice").innerText =
total.toLocaleString()+" บาท";

}

</script>

</body>
</html>
